name: near_basket
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.0.0
  url_launcher: ^6.1.11
  firebase_core: ^2.24.2
  cloud_firestore: ^4.14.0
  crypto: ^3.0.3
  # google_fonts: ^6.1.0
  shared_preferences: ^2.2.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  fl_chart: ^1.1.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0


flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/logo_icon.png"
    background_color: "#FFFDD0"
    theme_color: "#FFFDD0"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/data/
  # Trigger pub get
